<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>show-me 知识库 · 图解与概念解释合集</title>
<style>
  :root{--bg:#f5f7fb;--panel:#fff;--panel2:#f8fafc;--line:#dde3ee;--fg:#131c2e;--dim:#4a5871;
        --dim2:#657389;--accent:#17509e;--chip:#eef2f9;--chipb:#dbe2ee;
        --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15.5px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       padding:44px 20px 80px}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:14px;margin:0 0 10px}
  .statline{font:12px var(--mono);color:var(--dim2);margin:0 0 22px;display:flex;flex-wrap:wrap;gap:8px}
  .statline span{display:inline-flex;align-items:center;gap:6px}
  .statline i{width:5px;height:5px;border-radius:50%;background:#c3ccdb;display:inline-block}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
  .searchwrap{position:relative;flex:1 1 260px}
  .searchwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);
                  width:16px;height:16px;color:var(--dim2);pointer-events:none}
  #q{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;
     font-size:14.5px;background:var(--panel);color:var(--fg)}
  #q:focus{outline:2px solid #c7d7f5;border-color:#a8c0e8}
  .count{font:12px var(--mono);color:var(--dim2)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 26px}
  .chip{font:12px var(--mono);background:var(--chip);border:1px solid var(--chipb);color:#3f4c63;
        border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{background:#17509e;border-color:#17509e;color:#fff}
  h2.cat{font-size:16px;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
         display:flex;align-items:baseline;gap:9px;color:#0d1526}
  h2.cat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
                 flex:none;transform:translateY(-2px)}
  h2.cat span{font:11.5px var(--mono);color:var(--dim2);letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch}
  @media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:26px 14px 60px}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;
        box-shadow:0 1px 2px rgba(16,24,40,.04);display:flex;flex-direction:column;gap:9px;
        position:relative;overflow:hidden;
        transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);
                transform:scaleX(0);transform-origin:left;transition:transform .22s ease}
  .card:hover{box-shadow:0 6px 18px rgba(16,24,40,.09);border-color:#c9d6ea;transform:translateY(-1px)}
  .card:hover::before{transform:scaleX(1)}
  .card h3{margin:0;font-size:16px;line-height:1.45}
  .card h3 a{color:#0d1526;text-decoration:none}
  .card h3 a::after{content:"→";display:inline-block;margin-left:6px;color:var(--accent);
                    opacity:0;transform:translateX(-4px);transition:opacity .18s ease,transform .18s ease}
  .card:hover h3 a::after{opacity:1;transform:translateX(0)}
  .card h3 a:hover{color:var(--accent)}
  .card .one{color:var(--dim);font-size:13.5px;margin:0;flex:1 1 auto}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px}
  .card .tags span{font:11.5px var(--mono);background:var(--chip);border:1px solid var(--chipb);
                   border-radius:999px;padding:3px 8px;color:#3f4c63}
  .card .tags span.more{background:#fff;border-style:dashed;color:var(--dim2)}
  .card .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
              font:11.5px var(--mono);color:var(--dim2);border-top:1px solid #eef2f8;padding-top:10px}
  .card .foot .date{color:#3f4c63}
  .card .foot a{color:var(--accent);text-decoration:none}
  .card .foot a:hover{text-decoration:underline}
  .empty{color:var(--dim2);font:13px var(--mono);padding:30px 0;text-align:center}
  footer{color:var(--dim2);font:11.5px/1.75 var(--mono);text-align:center;margin-top:44px}
</style>
</head>
<body>
<div class="wrap">
  <h1>show-me 知识库</h1>

  <p class="statline"><span>9 篇图解</span><i></i><span>2 个分类</span><i></i><span>最近更新 2026-09-22</span></p>

  <div class="controls">
    <div class="searchwrap">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

      <input id="q" type="search" placeholder="搜索标题、标签、一句话…" autocomplete="off">

  <div class="chips" id="chips"></div>

  <div id="list"></div>

  <footer>由 build_index.py 从各目录 meta.json 生成 · 公开学习资料，内部标识已脱敏</footer>
</div>

const ENTRIES = [

    "slug": "dflash-pp-adaptation",
    "category": "inference-systems",
    "date": "2026-09-16",
    "tags": [
      "SGLang",
      "流水并行",

      "投机解码",
      "跨阶段通信",
      "正确性 bug"
    ],
    "one_liner": "上游 SGLang 有三道护栏硬性禁止 DFlash 与 PP 共存；适配没有碰算法，而是用一个 world_size=1 的伪造 PP 组让草稿模型整体跑在 PP0，并设计 aux hidden 去程累积、投影 context 回程两条通道穿过 PP ring。",

      "notes.md"

  {

    "slug": "ar-compute-overlap-moe-chunk",
    "category": "comm-parallel",

    "tags": [
      "AllReduce",

      "预填充",

    ],
    "one_liner": "把 MoE 前的那次全量 AllReduce 切成两片扔到侧流，主流拿第一片就先算：藏住 1.77 ms、付出 0.64+0.35 ms，净赚 0.78 ms/层（实测整层 −0.79，逐位吻合）；同容器 A/B 端到端 +2.8%/6.8%/7.7%（C=8/16/32），但同一补丁在 TP2×PP4 上净 ≈ 0 —— 收益正比于「被暴露的通信时长」，不是模型规模。",
    "artifact": "index.html",
    "session_id": "",
    "_dir": "comm-parallel/ar-compute-overlap-moe-chunk",
    "extra_files": [
      "notes.md"
    ]
  },
  {
    "title": "Prefill CP8 / Decode TP8：为什么 CP 能拿到收益",
    "slug": "prefill-cp8-decode-tp8",
    "category": "comm-parallel",
    "date": "2026-09-22",
    "tags": [
      "Context Parallel",
      "Prefill",
      "TP8",
      "Sparse MLA",
      "mHC",
      "超连接",
      "MoE",
      "AllGather",
      "ReduceScatter",
      "SGLang"
    ],
    "one_liner": "CP 的收益不来自注意力 FLOPs（TP8 与 CP8 每卡 query×head 都是 65,536），而来自把每卡行数从 8192 降到 1024：按 token 重复而 TP 切不动的算子（超连接 mHC、LayerNorm、量化、indexer）随之掉 8 倍（mHC 136.77→13.06 ms），注意力靠头数 8→64 的形状改善拿到 79.77→33.55 ms，注意力输出的 AllReduce 消失、换成 MoE 前后的 AllGather/ReduceScatter（通信 349.51→275.71 ms），而按权重算的 MoE GEMM 55.14→54.98 ms 一动不动；GPU 窗口 811.55→533.70 ms，C8 那一步输入吞吐 +27.1%、TTFT −34.5%、TPOT −15.8%（相对本轮起点 +56.85%/-48.14%/-34.04%），代价是 tp=1 的权重复制（静态显存比例 0.68→0.74）与 decode 侧运行时切片加 MXFP8 swizzled scale 重算。",
    "artifact": "index.html",
    "_dir": "comm-parallel/prefill-cp8-decode-tp8",
    "extra_files": []
  },
  {
    "title": "CUDA IPC 直推：decode 小消息换的是「固定开销」，不是带宽",
    "slug": "cuda-ipc-direct-push",
    "category": "comm-parallel",
    "date": "2026-09-20",
    "tags": [
      "AllReduce",
      "CUDA IPC",
      "PCIe",
      "张量并行",

      "延迟vs带宽"
    ],

    "artifact": "index.html",
    "_dir": "comm-parallel/cuda-ipc-direct-push",

    "slug": "allreduce-1stage-vs-2stage",
    "category": "comm-parallel",
    "date": "2026-09-15",
    "tags": [
      "AllReduce",
      "张量并行",
      "通信优化",
      "PCIe",
      "投机解码",
      "Amdahl"
    ],
    "one_liner": "把 AllReduce 从广播式改成 reduce-scatter + all-gather，单次归约 907 → 222.6 µs；收益全部来自「少搬 4 倍字节」，端到端 +60% 对 Amdahl 上限 +76% 的兑现率 91%。",
    "artifact": "index.html",
    "_dir": "comm-parallel/allreduce-1stage-vs-2stage",
    "extra_files": [
      "allreduce-infographic.png"
    ]

];
const CATS = {"inference-systems": "推理系统", "comm-parallel": "通信与并行"};
const state = { q: "", tag: null };

function matches(e) {
  if (state.tag && !e.tags.includes(state.tag)) return false;
  if (!state.q) return true;
  const hay = [e.title, e.one_liner, e.category, ...(e.tags || [])].join(" ").toLowerCase();
  return hay.includes(state.q.toLowerCase());
}

function render() {
  const list = document.getElementById("list");
  const shown = ENTRIES.filter(matches);
  const total = ENTRIES.length;
  document.getElementById("count").textContent = `${shown.length} / ${total} 篇`;

  if (!shown.length) {
    list.innerHTML = '<div class="empty">没有匹配的条目</div>';
    return;
  }
  const byCat = new Map();
  for (const e of shown) {
    if (!byCat.has(e.category)) byCat.set(e.category, []);
    byCat.get(e.category).push(e);
  }
  let html = "";
  for (const [cat, items] of byCat) {
    html += `<h2 class="cat">${CATS[cat] || cat}<span>${cat} · ${items.length}</span></h2><div class="grid">`;
    for (const e of items) {
      const MAXT = 3;
      const shown = (e.tags || []).slice(0, MAXT);
      const rest = (e.tags || []).length - shown.length;
      const tags = shown.map(t => `<span>${t}</span>`).join("") +
                   (rest > 0 ? `<span class="more">+${rest}</span>` : "");
      const extras = (e.extra_files || []).map(f => `<a href="${e._dir}/${f}">${f}</a>`).join("");
      html += `<div class="card">
        <h3><a href="${e._dir}/${e.artifact}">${e.title}</a></h3>
        <p class="one">${e.one_liner}</p>
        <div class="tags">${tags}</div>
        <div class="foot"><span>${e.date}</span>${extras}<a href="${e._dir}/meta.json">meta.json</a></div>
      </div>`;
    }
    html += "</div>";
  }
  list.innerHTML = html;
}

function renderChips() {
  const tags = [...new Set(ENTRIES.flatMap(e => e.tags || []))].sort();
  const box = document.getElementById("chips");
  box.innerHTML = tags.map(t => `<button class="chip" data-tag="${t}" aria-pressed="${state.tag === t}">${t}</button>`).join("");
  box.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    state.tag = state.tag === c.dataset.tag ? null : c.dataset.tag;
    renderChips(); render();
  }));
}

document.getElementById("q").addEventListener("input", ev => { state.q = ev.target.value; render(); });
renderChips(); render();
</script>
